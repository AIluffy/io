name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'tools/docs/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'vercel-docs-production'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Docs Dependencies
        run: npm exec nx run apps-docs:build-deps

      - name: Generate API Reference
        run: npm exec nx run apps-docs:generate-api

      - name: Sync Vercel Project Settings
        run: npm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/docs

      - name: Build Vercel Artifacts
        run: npm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        working-directory: apps/docs

      - name: Deploy to Vercel (Production)
        run: npm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/docs
