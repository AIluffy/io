name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npx nx run-many -t lint test build

      - run: npx nx run @iostore/store:perf-budget
      - run: npx nx run @iostore/store:bundle-size
      - run: npx nx run apps-docs:generate-bench

      - name: Upload benchmark docs artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-docs
          path: |
            tools/docs/bench-history.json
            apps/docs/src/content/docs/guides/benchmark.mdx
            apps/docs/src/content/docs/guides/benchmark-details.mdx
            apps/docs/src/content/docs/en/guides/benchmark.mdx
            apps/docs/src/content/docs/en/guides/benchmark-details.mdx

      - run: npx nx-cloud fix-ci
        if: always()
