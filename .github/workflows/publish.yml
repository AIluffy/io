name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');

          const output = process.env.GITHUB_OUTPUT;
          if (!output) process.exit(0);

          try {
            execSync('git rev-parse --verify HEAD^1', { stdio: 'ignore' });
          } catch {
            process.exit(0);
          }

          const diff = execSync('git diff --name-only HEAD^1 HEAD')
            .toString()
            .trim()
            .split('\n')
            .filter(Boolean);

          const pkgFiles = diff.filter((f) => /^packages\/[^/]+\/package\.json$/.test(f));
          if (!pkgFiles.length) process.exit(0);

          let changed = false;
          for (const file of pkgFiles) {
            const before = JSON.parse(execSync(`git show HEAD^1:${file}`).toString()).version;
            const after = JSON.parse(execSync(`git show HEAD:${file}`).toString()).version;
            if (before !== after) {
              changed = true;
              break;
            }
          }

          if (changed) {
            fs.appendFileSync(output, 'should_publish=true\n');
          }
          NODE

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.should_publish == 'true'
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
        if: steps.detect.outputs.should_publish == 'true'

      - run: npm exec nx -- run-many --targets=build
        if: steps.detect.outputs.should_publish == 'true'

      - name: Publish packages
        if: steps.detect.outputs.should_publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: npm exec nx release publish --access public
